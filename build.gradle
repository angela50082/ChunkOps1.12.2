// ChunkOps112 - 1.12.2 模组兼容区块编辑器
// 构建脚本（ForgeGradle 2.3 / Gradle 4.9 / JDK 8）
//
// 若网络受限（国内环境），将下列 maven 地址替换为 BMCLAPI 镜像：
//   https://maven.minecraftforge.net/  ->  https://bmclapi2.bangbang93.com/maven/
//   mavenCentral() 保持不变（或用阿里云镜像 https://maven.aliyun.com/repository/public）

buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = '0.1.2'
group = 'com.chunkops'
archivesBaseName = 'chunkops'

sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

minecraft {
    // 注意：1.12.2 用 14.23.5.2847（最后一个带 userdev jar 的构建）。
    // 2854/2860 无 forge-userdev.jar，FG2.3 的 extractUserdev 任务会 404 失败。
    version = '1.12.2-14.23.5.2847'
    runDir = 'run'
    mappings = 'stable_39'
    makeObfSourceJar = false
}

repositories {
    // 依赖仓库（暂无外部依赖）
}

// 把 chunkops-core / verify 工具链编入模组（阶段 3 GUI 直接复用文件模式数据层）
sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir 'tools/verifier/src'
        }
    }
}

dependencies {
}

processResources {
    // 必须显式指定 UTF-8：expand 过滤器默认用平台编码（中文 Windows=GBK），
    // 会把 mcmod.info 里的中文读坏（实测 jar 内 description 中文变乱码/丢字节）。
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
}

jar {
    manifest {
        attributes 'FMLCorePluginContainsFMLMod': 'false'
    }
}
